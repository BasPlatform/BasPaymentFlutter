buildProdWeb:
  - $cleanAndGet
  #  - fvm flutter build bundle
  - fvm flutter build web --release --no-tree-shake-icons --dart-define=FLAVOR=prod

buildDevWeb:
  - $cleanAndGet
  #  - fvm flutter build bundle
  - fvm flutter build web --release --no-tree-shake-icons --dart-define=FLAVOR=dev

buildProdWebAndDeploy:
  - $buildProdWeb
  - firebase deploy --only hosting:prod-target

buildDevWebAndDeploy:
  - $buildDevWeb
  - firebase deploy --only hosting:dev-target

buildDevWasmAndDeploy:
  - $cleanAndGet
  - fvm flutter build web --wasm --release --no-tree-shake-icons --dart-define=FLAVOR=dev
  - firebase deploy --only hosting:dev-target


buildMerchWeb:
  - $cleanAndGet
  #  - fvm flutter build bundle
  - fvm flutter build web --release --no-tree-shake-icons --base-href /merch/ --dart-define=FLAVOR=prod

