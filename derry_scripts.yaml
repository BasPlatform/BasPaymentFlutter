dartFix:
  - fvm dart fix --apply

cleanAndGet:
  - fvm flutter clean
  - fvm flutter pub get

buildDevApk:
  - $cleanAndGet
  - fvm flutter build apk --flavor stage --dart-define=FLAVOR=stage --split-per-abi --obfuscate --split-debug-info --release


buildProdApk:
  - $cleanAndGet
  - fvm flutter build apk --split-per-abi --obfuscate --split-debug-info --release


buildSplitApk:
  - $cleanAndGet
  - fvm flutter build apk --split-per-abi --obfuscate --split-debug-info --release

buildBundle:
  - $cleanAndGet
  - fvm flutter build appbundle --obfuscate --split-debug-info --release
  - #.IOS......................................................

buildIPA:
  - $cleanAndGet
  - fvm flutter build ipa --obfuscate --split-debug-info --release

